name: Fork images

# ─────────────────────────────────────────────────────────────────────────────
# Builds the FORK's control-plane images and pushes them to our own registry
# (Gitea). This is what makes `openship update` on the VPS pull OUR images:
# the compose template pins `image: ${OPENSHIP_IMAGE_REGISTRY:-ghcr.io/oblien}/
# openship-api:${OPENSHIP_VERSION:-latest}`, and the VPS `.env` sets
# OPENSHIP_IMAGE_REGISTRY to this registry. Tagging rule that makes update work:
#
#   <package.json version>   e.g. 0.9.2 — `openship update` repins
#                            OPENSHIP_VERSION to the version of the CLI it just
#                            installed, so the plain-version tag MUST exist in
#                            our registry for the pull to resolve. This tag
#                            moves when the VERSION changes — an upstream bump
#                            merged by the sync, or our own bump push. Merges
#                            that don't change the version don't republish
#                            (same content, nothing to hand to update).
#   <version>-<shortsha>     immutable, for rollback pins
#   latest                   convenience
#
# Triggers (all gated on the version actually changing; dispatch overrides):
#   • workflow_dispatch  — manual, always publishes
#   • push to main       — publishes only if the version changed vs HEAD^
#   • workflow_call      — chained from fork-sync.yml after an upstream merge
#
# Needs repo VARIABLES (non-secret, GitHub's ".env" for workflows — the real
# host must not live in a committed file, this fork is public):
#   FORK_REGISTRY   host, e.g. gitea.example.com
#   FORK_NAMESPACE  optional, default medali
# and repo SECRETS (push auth — can never be public):
#   FORK_REGISTRY_USER, FORK_REGISTRY_TOKEN (write)
# Local builds use the same keys from a gitignored `fork.env` — see
# scripts/fork/build-images.sh and docs/fork-maintenance.md.
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
  push:
    branches: [main]
  workflow_call:

concurrency:
  group: fork-images-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

# Publish only when it means something: the version must have CHANGED vs the
# previous commit (an upstream version bump merged in, or our own bump push).
# Re-publishing an unchanged version just re-tags the same content and races
# itself (seen live: a chained sync run collided with a push-triggered run of
# the same tip on the cli-<version>-<sha> release). workflow_dispatch is the
# explicit manual override and always publishes.
jobs:
  gate:
    name: Version changed?
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.check.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          ref: main
      - name: Compare the version across the tip
        id: check
        run: |
          set -eu
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "manual dispatch — publishing"
            exit 0
          fi
          before="$(git show 'HEAD^:package.json' 2>/dev/null | sed -n 's/^  "version": "\(.*\)",$/\1/p' | head -n1)"
          after="$(sed -n 's/^  "version": "\(.*\)",$/\1/p' package.json | head -n1)"
          echo "before=$before after=$after"
          if [ -n "$after" ] && [ "$before" != "$after" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "version unchanged — nothing to publish"
          fi

  build:
    name: Build + push ${{ matrix.image }}
    needs: gate
    if: needs.gate.outputs.publish == 'true'
    # GitHub-hosted: this repo is public, so these runners are free, and
    # buildx + the GHA layer cache consistently land the three images in
    # ~7 minutes — the small VPS runner needed 15-25 even warm (see
    # docs/fork-maintenance.md "Where the pipeline runs"). fork-sync keeps the
    # Openship-runner dogfood; the heavy artifact builds do not.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # The three images a VPS compose install runs. Add mail/webmail/
        # cluster-tasks here if the box ever needs them.
        image: [api, dashboard, edge]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The rollback tag names the built commit — needs the real SHA.
          fetch-depth: 0
          # `main`, not the event sha: when chained from fork-sync via
          # workflow_call, github.sha is the PRE-merge tip that triggered the
          # sync — without this, every merge publishes images of the
          # previous commit and the merge itself is never built.
          ref: main

      - name: Resolve image tags
        id: tags
        run: |
          set -eu
          # Shell-native on purpose: the runner container has no system node.
          version="$(sed -n 's/^  "version": "\(.*\)",$/\1/p' package.json | head -n1)"
          case "$version" in
            *.*) ;;
            *) echo "cannot parse version from package.json" >&2; exit 1 ;;
          esac
          sha="$(git rev-parse --short HEAD)"
          registry="${{ vars.FORK_REGISTRY }}"
          [ -n "$registry" ] || { echo "FORK_REGISTRY repo variable is not set (Settings → Secrets and variables → Actions → Variables)"; exit 1; }
          ns="${{ vars.FORK_NAMESPACE || 'medali' }}"
          name="$registry/$ns/openship-${{ matrix.image }}"
          {
            echo "version=$version"
            echo "images<<EOF"
            echo "$name:$version"
            echo "$name:$version-$sha"
            echo "$name:latest"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to the fork registry
        run: |
          docker login "${{ vars.FORK_REGISTRY }}" \
            --username "${{ secrets.FORK_REGISTRY_USER }}" \
            --password "${{ secrets.FORK_REGISTRY_TOKEN }}"

      # Context is the repo root: the Dockerfiles COPY packages/ and sibling
      # apps/. amd64 only — the VPS is x86_64; add a platform axis before
      # pointing an arm box at this registry.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.image }}/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.images }}
          cache-from: type=gha,scope=fork-${{ matrix.image }}
          cache-to: type=gha,scope=fork-${{ matrix.image }},mode=max

      - name: Print what the VPS can pin
        run: |
          echo "Pushed ${{ matrix.image }}:"
          echo "  moving:     ${{ vars.FORK_REGISTRY }}/${{ vars.FORK_NAMESPACE || 'medali' }}/openship-${{ matrix.image }}:${{ steps.tags.outputs.version }}"
          echo "  rollback:   …:${{ steps.tags.outputs.version }}-$(git rev-parse --short HEAD)"
