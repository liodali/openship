name: Fork images

# ─────────────────────────────────────────────────────────────────────────────
# Builds the FORK's control-plane images and pushes them to our own registry
# (Gitea). This is what makes `openship update` on the VPS pull OUR images:
# the compose template pins `image: ${OPENSHIP_IMAGE_REGISTRY:-ghcr.io/oblien}/
# openship-api:${OPENSHIP_VERSION:-latest}`, and the VPS `.env` sets
# OPENSHIP_IMAGE_REGISTRY to this registry. Tagging rule that makes update work:
#
#   <package.json version>   e.g. 0.9.2 — `openship update` repins
#                            OPENSHIP_VERSION to the version of the CLI it just
#                            installed, so the plain-version tag MUST exist in
#                            our registry for the pull to resolve. This tag
#                            moves when the VERSION changes — an upstream bump
#                            merged by the sync, or our own bump push. Merges
#                            that don't change the version don't republish
#                            (same content, nothing to hand to update).
#   <version>-<shortsha>     immutable, for rollback pins
#   latest                   convenience
#
# Triggers (all gated on the version actually changing; dispatch overrides):
#   • workflow_dispatch  — manual, always publishes
#   • push to main       — publishes only if the version changed vs HEAD^
#   • workflow_call      — chained from fork-sync.yml after an upstream merge
#
# Needs repo VARIABLES (non-secret, GitHub's ".env" for workflows — the real
# host must not live in a committed file, this fork is public):
#   FORK_REGISTRY   host, e.g. gitea.example.com
#   FORK_NAMESPACE  optional, default medali
# and repo SECRETS (push auth — can never be public):
#   FORK_REGISTRY_USER, FORK_REGISTRY_TOKEN (write)
# Local builds use the same keys from a gitignored `fork.env` — see
# scripts/fork/build-images.sh and docs/fork-maintenance.md.
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
  push:
    branches: [main]
  workflow_call:

concurrency:
  group: fork-images-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

# Publish only when it means something: the version must have CHANGED vs the
# previous commit (an upstream version bump merged in, or our own bump push).
# Re-publishing an unchanged version just re-tags the same content and races
# itself (seen live: a chained sync run collided with a push-triggered run of
# the same tip on the cli-<version>-<sha> release). workflow_dispatch is the
# explicit manual override and always publishes.
jobs:
  gate:
    name: Version changed?
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.check.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          ref: main
      - name: Compare the version across the tip
        id: check
        run: |
          set -eu
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "manual dispatch — publishing"
            exit 0
          fi
          before="$(git show 'HEAD^:package.json' 2>/dev/null | sed -n 's/^  "version": "\(.*\)",$/\1/p' | head -n1)"
          after="$(sed -n 's/^  "version": "\(.*\)",$/\1/p' package.json | head -n1)"
          echo "before=$before after=$after"
          if [ -n "$after" ] && [ "$before" != "$after" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "version unchanged — nothing to publish"
          fi

  build:
    name: Build + push ${{ matrix.image }}
    needs: gate
    if: needs.gate.outputs.publish == 'true'
    # The Openship self-hosted runner (rootless podman VPS) — the same
    # destination the fsvger pipeline already builds on. Safe because this
    # workflow only ever runs OUR code: push to main, manual dispatch, or
    # chained from fork-sync — never pull_request.
    runs-on: [self-hosted, openship, linux, x64]
    timeout-minutes: 90 # cold build + cache serialization can exceed an hour
    strategy:
      fail-fast: false
      # One small rootless-podman box: build serially so three image builds
      # cannot thrash the runner's CPU/RAM limits at once.
      max-parallel: 1
      matrix:
        # The three images a VPS compose install runs. Add mail/webmail/
        # cluster-tasks here if the box ever needs them.
        image: [api, dashboard, edge]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The rollback tag names the built commit — needs the real SHA.
          fetch-depth: 0
          # `main`, not the event sha: when chained from fork-sync via
          # workflow_call, github.sha is the PRE-merge tip that triggered the
          # sync — without this, every daily merge publishes images of the
          # previous commit and the merge itself is never built.
          ref: main

      - name: Resolve image tags
        id: tags
        run: |
          set -eu
          # Shell-native on purpose: the runner container has no system node.
          version="$(sed -n 's/^  "version": "\(.*\)",$/\1/p' package.json | head -n1)"
          case "$version" in
            *.*) ;;
            *) echo "cannot parse version from package.json" >&2; exit 1 ;;
          esac
          sha="$(git rev-parse --short HEAD)"
          registry="${{ vars.FORK_REGISTRY }}"
          [ -n "$registry" ] || { echo "FORK_REGISTRY repo variable is not set (Settings → Secrets and variables → Actions → Variables)"; exit 1; }
          ns="${{ vars.FORK_NAMESPACE || 'medali' }}"
          name="$registry/$ns/openship-${{ matrix.image }}"
          {
            echo "version=$version"
            echo "images<<EOF"
            echo "$name:$version"
            echo "$name:$version-$sha"
            echo "$name:latest"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to the fork registry
        run: |
          docker login "${{ vars.FORK_REGISTRY }}" \
            --username "${{ secrets.FORK_REGISTRY_USER }}" \
            --password "${{ secrets.FORK_REGISTRY_TOKEN }}"

      # ── Builder-stage cache in Garage S3 (api/dashboard only) ──────────────
      # node_modules inside the `builder` stage dominates cold build time.
      # Podman's local layer cache already helps but dies with any storage
      # prune; the bucket survives. Layers are saved as a gzipped `docker
      # save` of the --target builder image, keyed by EVERYTHING the install
      # layer COPYs (manifests, lockfile, patches, Dockerfile). Skipped
      # entirely until FORK_S3_ENDPOINT is configured — the build must never
      # depend on the cache existing.
      - name: Set up Bun
        if: matrix.image != 'edge' && vars.FORK_S3_ENDPOINT != ''
        uses: oven-sh/setup-bun@v2

      - name: Restore builder layers from Garage
        id: builder-cache
        if: matrix.image != 'edge' && vars.FORK_S3_ENDPOINT != ''
        env:
          S3_ENDPOINT: ${{ vars.FORK_S3_ENDPOINT }}
          S3_BUCKET: ${{ vars.FORK_S3_BUCKET || 'openship-builds' }}
          S3_KEY: ${{ secrets.FORK_S3_KEY }}
          S3_SECRET: ${{ secrets.FORK_S3_SECRET }}
        run: |
          set -eu
          key="builder/${{ matrix.image }}-$( { cat package.json bun.lock tsconfig.base.json "apps/${{ matrix.image }}/Dockerfile"; find patches -type f -print0 | sort -z | xargs -0 sha256sum; } | sha256sum | cut -c1-32)"
          echo "key=$key" >> "$GITHUB_OUTPUT"
          echo "cache key: $key"
          dir="$RUNNER_TEMP/s3"
          mkdir -p "$dir"
          cd "$dir"
          echo '{"dependencies":{}}' > package.json
          bun add @aws-sdk/client-s3@3.826.0 --silent
          cat > s3.mjs <<'EOF'
          import { S3Client, GetObjectCommand, PutObjectCommand } from "@aws-sdk/client-s3";
          import { createReadStream, createWriteStream } from "node:fs";
          import { pipeline } from "node:stream/promises";
          const [, , op, key, file] = process.argv;
          const client = new S3Client({
            endpoint: process.env.S3_ENDPOINT,
            region: process.env.S3_REGION || "garage",
            forcePathStyle: true,
            credentials: {
              accessKeyId: process.env.S3_KEY,
              secretAccessKey: process.env.S3_SECRET,
            },
          });
          const bucket = process.env.S3_BUCKET;
          if (op === "get") {
            try {
              const res = await client.send(new GetObjectCommand({ Bucket: bucket, Key: key }));
              await pipeline(res.Body, createWriteStream(file));
              console.log("cache hit");
            } catch (error) {
              if (error.name === "NoSuchKey") {
                console.log("cache miss");
                process.exit(3);
              }
              throw error;
            }
          } else {
            await client.send(
              new PutObjectCommand({ Bucket: bucket, Key: key, Body: createReadStream(file) }),
            );
            console.log("uploaded");
          }
          EOF
          if bun s3.mjs get "$key" "$RUNNER_TEMP/builder-cache.tar.gz"; then
            docker load --input "$RUNNER_TEMP/builder-cache.tar.gz"
            echo "hit=true" >> "$GITHUB_OUTPUT"
          else
            echo "hit=false" >> "$GITHUB_OUTPUT"
          fi
          rm -f "$RUNNER_TEMP/builder-cache.tar.gz"

      # Context is the repo root: the Dockerfiles COPY packages/ and sibling
      # apps/. amd64 only — the VPS is x86_64.
      #
      # Plain `docker build` (the podman-proven pattern the fsvger pipeline
      # already uses on the same box), NOT buildx: the BuildKit container
      # driver is unreliable under the docker-compat socket, and there is no
      # GHA cache on a self-hosted runner anyway — the podman service's own
      # layer cache on the VPS serves that role between runs.
      - name: Build and push
        run: |
          set -eu
          while IFS= read -r image; do
            [ -n "$image" ] || continue
            echo "Building $image…"
            docker build --file "apps/${{ matrix.image }}/Dockerfile" --tag "$image" .
            docker push "$image"
          done <<EOF
          ${{ steps.tags.outputs.images }}
          EOF

      # The registry has the layers; local tag refs would pile up on the VPS
      # (moving + sha + latest per run). rmi drops the tags while the podman
      # layer cache — the actual speed win — stays untouched.
      - name: Save builder layers to Garage
        if: matrix.image != 'edge' && vars.FORK_S3_ENDPOINT != '' && steps.builder-cache.outputs.hit == 'false'
        env:
          S3_ENDPOINT: ${{ vars.FORK_S3_ENDPOINT }}
          S3_BUCKET: ${{ vars.FORK_S3_BUCKET || 'openship-builds' }}
          S3_KEY: ${{ secrets.FORK_S3_KEY }}
          S3_SECRET: ${{ secrets.FORK_S3_SECRET }}
        run: |
          set -eu
          cache_tag="openship-builder-cache:${{ matrix.image }}"
          # After a successful full build every builder layer is in local
          # cache, so --target builder is a no-op rebuild: this step is pure
          # serialization (docker save | gzip -1) + upload. Garage and the VPS
          # share a network, so the upload is the cheap part.
          docker build --file "apps/${{ matrix.image }}/Dockerfile" --target builder --tag "$cache_tag" .
          docker save "$cache_tag" | gzip -1 > "$RUNNER_TEMP/builder-cache.tar.gz"
          (cd "$RUNNER_TEMP/s3" && bun s3.mjs put "${{ steps.builder-cache.outputs.key }}" "$RUNNER_TEMP/builder-cache.tar.gz")
          rm -f "$RUNNER_TEMP/builder-cache.tar.gz"
          docker rmi "$cache_tag" >/dev/null 2>&1 || true

      - name: Drop the local image tags
        if: always()
        run: |
          while IFS= read -r image; do
            [ -n "$image" ] || continue
            docker rmi "$image" >/dev/null 2>&1 || true
          done <<EOF
          ${{ steps.tags.outputs.images }}
          EOF

      - name: Print what the VPS can pin
        run: |
          echo "Pushed ${{ matrix.image }}:"
          echo "  moving:     ${{ vars.FORK_REGISTRY }}/${{ vars.FORK_NAMESPACE || 'medali' }}/openship-${{ matrix.image }}:${{ steps.tags.outputs.version }}"
          echo "  rollback:   …:${{ steps.tags.outputs.version }}-$(git rev-parse --short HEAD)"
